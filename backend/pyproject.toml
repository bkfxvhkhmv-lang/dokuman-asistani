[project]
name = "briefpilot-backend"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "sqlalchemy>=2.0.0",
    "alembic>=1.13.0",
    "asyncpg>=0.29.0",
    "psycopg2-binary>=2.9.9",
    "pgvector>=0.2.5",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "python-multipart>=0.0.9",
    "python-jose[cryptography]>=3.3.0",
    "PyJWT[crypto]>=2.8.0",
    "passlib[bcrypt]>=1.7.4",
    "httpx>=0.27.0",
    "redis>=5.0.0",
    "celery[redis]>=5.3.0",
    "minio>=7.2.0",
    # PaddleOCR 3.x: motor Paddle içinde (torch/transformers bu projede yok → eklemeyin; PO opsiyonel
    # doc/-layout bağımlılıkları transformers çekebilir, saf OCR için gereksiz ve çakışma riski taşır).
    # Tek major: 2.x ve 3.x aynı ortamda kurulmasın (pip uyarmaz).
    # NumPy: Paddle sürüm tablosuna göre gevşet/sıkılaştır; çakışmada `pip check`.
    # Docker dışı (Mint): genelde önce `pip install paddlepaddle -i https://www.paddlepaddle.org.cn/packages/stable/cpu/`
    "paddlepaddle>=3.0.0,<4.0.0",
    "paddleocr>=3.0.0,<4.0.0",
    "openai>=1.30.0",
    "anthropic>=0.28.0",
    "tiktoken>=0.7.0",
    "Pillow>=10.0.0",
    "pymupdf>=1.24.0",
    "pypdf>=4.0.0",
    "python-magic>=0.4.27",
    "structlog>=24.0.0",
    "prometheus-fastapi-instrumentator>=6.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.mypy]
python_version = "3.11"
strict = false
ignore_missing_imports = true
