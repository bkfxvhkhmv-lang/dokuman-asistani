Global:
  debug: false
  use_gpu: true
  epoch_num: 30
  log_smooth_window: 20
  print_batch_step: 50
  save_model_dir: /workspace/output/briefpilot_ppocrv4_v5_comprehensive_80k_w480
  save_epoch_step: 2
  eval_batch_step: [0, 500]
  cal_metric_during_train: true
  pretrained_model: /workspace/checkpoint/best_accuracy   # v4 splitaddr %95.21
  checkpoints: null
  save_inference_dir: null
  use_visualdl: false
  infer_img: null
  character_dict_path: /workspace/dataset/dict/german_dict.txt
  max_text_length: 45
  infer_mode: false
  use_space_char: true
  distributed: false
  save_res_path: ./output/rec/predicts_v5.txt

Optimizer:
  name: Adam
  beta1: 0.9
  beta2: 0.999
  lr:
    name: Cosine
    learning_rate: 0.00003   # düşük LR — fine-tune
    warmup_epoch: 1
  regularizer:
    name: L2
    factor: 3.0e-05

Architecture:
  model_type: rec
  algorithm: SVTR_LCNet
  Transform: null
  Backbone:
    name: PPLCNetV3
    scale: 0.95
  Head:
    name: MultiHead
    head_list:
      - CTCHead:
          Neck:
            name: svtr
            dims: 120
            depth: 2
            hidden_dims: 120
            kernel_size: [1, 3]
            use_guide: true
          Head:
            fc_decay: 1.0e-05
      - NRTRHead:
          nrtr_dim: 384
          max_text_length: &max_text_length 45

Loss:
  name: MultiLoss
  loss_config_list:
    - CTCLoss:
    - NRTRLoss:

PostProcess:
  name: CTCLabelDecode

Metric:
  name: RecMetric
  main_indicator: acc
  ignore_space: false

Train:
  dataset:
    name: SimpleDataSet
    data_dir: /workspace/dataset/rec/train
    ext_op_transform_idx: 1
    label_file_list:
      - /workspace/dataset/rec/train/label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - RecConAug:
          prob: 0.5
          ext_data_num: 2
          image_shape: [48, 480, 3]
          max_text_length: *max_text_length
      - RecAug:
      - MultiLabelEncode:
          max_text_length: *max_text_length
      - RecResizeImg:
          image_shape: [3, 48, 480]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: true
    batch_size_per_card: 512
    drop_last: true
    num_workers: 4

Eval:
  dataset:
    name: SimpleDataSet
    data_dir: /workspace/dataset/rec/val
    label_file_list:
      - /workspace/dataset/rec/val/label.txt
    transforms:
      - DecodeImage:
          img_mode: BGR
          channel_first: false
      - MultiLabelEncode:
          max_text_length: *max_text_length
      - RecResizeImg:
          image_shape: [3, 48, 480]
      - KeepKeys:
          keep_keys:
            - image
            - label_ctc
            - label_gtc
            - length
            - valid_ratio
  loader:
    shuffle: false
    drop_last: false
    batch_size_per_card: 512
    num_workers: 4
